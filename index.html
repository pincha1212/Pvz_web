<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora Defenders - v1.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="game-container">
    <div id="main-menu">
      <h1>FLORA DEFENDERS</h1>
      <h3>Selecciona tu campo de batalla estratégico</h3>
      <div id="map-selector"></div>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>

    <div id="ui-layer">
      <div id="top-bar">
        <div class="left-controls">
          <button id="btn-menu">← Menú</button>
          <div id="resource-counter">
            <span class="resource-icon"></span>
            <span id="resource-amount">50</span>
          </div>
          <div id="seed-bank"></div>
        </div>
        <div class="right-controls">
          <div id="map-indicator">Mapa 1</div>
          <div id="wave-indicator">Cargando...</div>
        </div>
      </div>

      <div id="message-overlay">
        <span id="main-message">¡PREPÁRATE!</span>
        <div id="unlock-info">
          <span>¡Nueva semilla desbloqueada!</span>
          <div id="unlock-icon" class="seed-icon"></div>
          <span id="unlock-name">Planta</span>
        </div>
        <div class="message-actions">
          <button id="action-btn">Reintentar</button>
          <button id="next-map-btn">Siguiente Mapa</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
